    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Movie List</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Hegarty&family=Lexend+Mega:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <header>
            <div class="container">
                <h1>My Movie List</h1>
            </div>
        </header>

        <div class="container">
            <div id="grid">
                <section id="movie-add">
                    <h3>Add Movie</h3>
        
                    <form action="" id="add-movie">
                        <label for="title">Title</label><br>
                        <input type="text" name="title" id="title"><br>
                        <label for="year">Year of release</label><br>
                        <input type="number" name="year" id="year"><br>
                        <label for="rating">Rating</label><br>
                        <input type="text" name="rating" id="rating"><br>
                        <label for="movieid">Movie ID</label><br>
                        <input type="number" name="movieid" id="movieid"><br>
        
                        <input type="submit" value="Add">
                    </form>
                    <br>
                    <button id="update-display">Update Display</button>
                </section>

                <section>
                    <h3>Search</h3>
                    <form>
                        <label for="search"></label>
                        <input type="text" name="search" id="search" title="enter text to search"><br>
                        <button id="by-id">By Id</button>
                        <button id="by-title">By Title</button>
                    </form>
                </section>
                <div></div>
                    <section>
                        <h3>Sort</h3>
            
                        <form action="" id="sort-movies">
                            <input type="radio" id="A-Z" name="sort-type" value="A-Z", checked>
                            <label for="A-Z">A-Z</label><br>
                            <input type="radio" id="Z-A" name="sort-type" value="Z-A">
                            <label for="Z-A">Z-A</label><br>
                            <input type="radio" id="best-movies" name="sort-type" value="best-movies">
                            <label for="best-movies">Best Movies</label>
                        </form>
                    </section>
            </div>
        <h3>Display</h3>
        <section id="movies">

        </section>
        </div>

        <footer>
            <div class="container">
                <h5>Your movie list</h5>
                <h6>Created by <span class="accent">Jed McKenna</span></h6>
            </div>
        </footer>

        <script src="./javascript.js"></script>
    </body>
    </html>
